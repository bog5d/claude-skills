<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title><%- PPT_TITLE %\></title>

  <!-- ===== 1. CDN 引用 ===== -->
  <!-- Reveal.js 5.2.1 核心 CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/reveal.min.css" />
  <!-- Reveal.js 5.2.1 black 深色主题（默认） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/theme/black.css" id="theme-link" />
  <!-- Highlight.js 代码高亮（可选） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/plugin/highlight/monokai.css" />

  <!-- ===== 2. 商务风格自定义 CSS ===== -->
  <style>
    /* ---------- 全局重置 & 字体 ---------- */
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    /* ---------- 更小的间距（商务紧凑风） ---------- */
    .reveal {
      font-size: 28px;                /* 基础字号稍小，适合商务场景 */
    }
    .reveal h1 { font-size: 2.8em; margin-bottom: 0.3em; }
    .reveal h2 { font-size: 2.0em; margin-bottom: 0.25em; }
    .reveal h3 { font-size: 1.4em; margin-bottom: 0.2em; }
    .reveal h4 { font-size: 1.1em; margin-bottom: 0.15em; }
    .reveal p  { margin-bottom: 0.3em; line-height: 1.5; }
    .reveal ul, .reveal ol { margin: 0.3em 0; }
    .reveal li { margin-bottom: 0.15em; }
    .reveal section { padding: 0.3em 0; }

    /* ---------- 数据表格大标题加粗 ---------- */
    .reveal table {
      font-size: 0.8em;
      border-collapse: collapse;
      width: 100%;
      margin: 0.5em 0;
    }
    .reveal table th {
      font-weight: 700;
      background: linear-gradient(135deg, <%- BRAND_COLOR_1 %\>, <%- BRAND_COLOR_2 %\>);
      color: #fff;
      padding: 10px 16px;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .reveal table td {
      padding: 8px 16px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    /* 条纹行 */
    .reveal table tbody tr:nth-child(even) {
      background: rgba(255,255,255,0.06);
    }
    .reveal table tbody tr:nth-child(odd) {
      background: transparent;
    }
    /* 鼠标悬停高亮 */
    .reveal table tbody tr:hover {
      background: rgba(255,255,255,0.12);
      transition: background 0.2s ease;
    }

    /* ---------- 卡片式布局 ---------- */
    .card-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 0.5em 0;
    }
    .card {
      background: rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 20px 24px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      min-width: 160px;
      flex: 1 1 180px;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    .card .icon {
      font-size: 2.2em;
      margin-bottom: 0.2em;
      display: block;
    }
    .card .value {
      font-size: 2.4em;
      font-weight: 700;
      background: linear-gradient(135deg, <%- BRAND_COLOR_1 %\>, <%- BRAND_COLOR_2 %\>);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .card .label {
      font-size: 0.7em;
      opacity: 0.75;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ---------- 冷色调渐变 & 品牌色条纹 ---------- */
    .brand-stripe {
      width: 80px;
      height: 4px;
      background: linear-gradient(90deg, <%- BRAND_COLOR_1 %\>, <%- BRAND_COLOR_2 %\>);
      border-radius: 2px;
      margin: 0.5em auto;
    }
    .brand-stripe.left {
      margin: 0.5em 0;
    }

    /* ---------- 百分比条（进度条） ---------- */
    .progress-bar-container {
      width: 100%;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      overflow: hidden;
      height: 20px;
      margin: 4px 0;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, <%- BRAND_COLOR_1 %\>, <%- BRAND_COLOR_2 %\>);
      border-radius: 8px;
      transition: width 0.6s ease;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      font-size: 0.7em;
      color: #fff;
      font-weight: 600;
    }

    /* ---------- 双列对比布局 ---------- */
    .two-columns {
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: stretch;
      margin: 0.5em 0;
    }
    .two-columns > div {
      flex: 1;
      padding: 20px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .two-columns h4 {
      margin-top: 0;
      border-bottom: 2px solid rgba(255,255,255,0.15);
      padding-bottom: 8px;
    }

    /* ---------- 封面专用样式 ---------- */
    .cover-title {
      font-size: 3.6em;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 0.15em;
    }
    .cover-subtitle {
      font-size: 1.4em;
      opacity: 0.75;
      margin-bottom: 0.3em;
    }
    .cover-date {
      font-size: 0.8em;
      opacity: 0.5;
      letter-spacing: 1px;
    }

    /* ---------- 总结/CTA 页 ---------- */
    .cta-button {
      display: inline-block;
      padding: 14px 40px;
      margin-top: 0.5em;
      background: linear-gradient(135deg, <%- BRAND_COLOR_1 %\>, <%- BRAND_COLOR_2 %\>);
      color: #fff;
      border-radius: 40px;
      font-size: 1.1em;
      font-weight: 600;
      letter-spacing: 1px;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .cta-button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    }

    /* ---------- 白/浅色模式适配 ---------- */
    .white-theme .reveal table th {
      background: linear-gradient(135deg, <%- BRAND_COLOR_1 %\>, <%- BRAND_COLOR_2 %\>);
    }
    .white-theme .reveal table td {
      border-color: rgba(0,0,0,0.12);
    }
    .white-theme .reveal table tbody tr:nth-child(even) {
      background: rgba(0,0,0,0.04);
    }
    .white-theme .reveal table tbody tr:nth-child(odd) {
      background: transparent;
    }
    .white-theme .reveal table tbody tr:hover {
      background: rgba(0,0,0,0.08);
    }
    .white-theme .card {
      background: rgba(0,0,0,0.04);
      border-color: rgba(0,0,0,0.1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .white-theme .card:hover {
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .white-theme .card .value {
      -webkit-text-fill-color: initial;
      color: <%- BRAND_COLOR_1 %\>;
    }
    .white-theme .progress-bar-container {
      background: rgba(0,0,0,0.08);
    }
    .white-theme .two-columns > div {
      background: rgba(0,0,0,0.03);
      border-color: rgba(0,0,0,0.08);
    }
    .white-theme .two-columns h4 {
      border-bottom-color: rgba(0,0,0,0.12);
    }

    /* ---------- 主题切换按钮 ---------- */
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.7em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      font-family: inherit;
    }
    .theme-toggle:hover {
      background: rgba(255,255,255,0.2);
    }
    .white-theme .theme-toggle {
      background: rgba(0,0,0,0.06);
      border-color: rgba(0,0,0,0.12);
      color: #333;
    }
    .white-theme .theme-toggle:hover {
      background: rgba(0,0,0,0.1);
    }

    /* ---------- 动画 ---------- */
    .fade-in-up {
      animation: fadeInUp 0.6s ease forwards;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

  <!-- ===== 4. 初始化脚本 ===== -->
  <script>
    // ---------- 主题切换 ----------
    function toggleTheme() {
      const body = document.body;
      const themeLink = document.getElementById('theme-link');
      body.classList.toggle('white-theme');

      if (body.classList.contains('white-theme')) {
        themeLink.href = 'https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/theme/white.css';
      } else {
        themeLink.href = 'https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/theme/black.css';
      }
    }

    // ---------- Reveal.js 初始化 ----------
    Reveal.initialize({
      // 基础配置
      controls: true,           // ← → 导航箭头
      controlsTutorial: false,
      controlsLayout: 'bottom-right',
      controlsBackArrows: 'visible',
      progress: true,           // 底部进度条
      slideNumber: true,        // 显示页码
      hash: true,
      history: true,
      keyboard: true,           // 键盘导航（← →, ESC总览, F全屏）
      overview: true,           // ESC 总览模式
      center: true,
      touch: true,
      loop: false,
      rtl: false,
      shuffle: false,
      fragments: true,
      embedded: false,
      help: true,
      showNotes: false,
      autoPlayMedia: null,
      preloadIframes: null,
      autoSlide: 0,
      autoSlideStoppable: true,
      defaultTiming: 120,
      mouseWheel: false,
      hideInactiveCursor: true,
      hideCursorTime: 3000,
      hideAddressBar: true,
      previewLinks: false,
      transition: 'slide',              // 全局过渡动画
      transitionSpeed: 'default',
      backgroundTransition: 'slide',
      viewDistance: 3,
      parallaxBackgroundImage: '',
      parallaxBackgroundSize: '',
      parallaxBackgroundHorizontal: null,
      parallaxBackgroundVertical: null,
      display: 'block',

      // 插件
      plugins: [
        RevealHighlight,
        RevealZoom,
        RevealNotes
      ]
    });

    // ---------- 页面加载完成后重新渲染 Chart.js 图表 ----------
    // 注意：需要在对应的 <section> 内部用 <script> 标签创建图表实例。
    // Reveal 在 slide 进入时自动执行其中的脚本。
    // 如遇图表渲染问题，可在此监听 slidechange 事件触发 resize
    Reveal.on('slidechanged', function(event) {
      // 通知所有 Chart.js 实例根据容器重新调整大小
      if (window.Chart && Chart.instances) {
        Object.values(Chart.instances).forEach(function(instance) {
          if (instance && instance.resize) {
            instance.resize();
          }
        });
      }
    });
  </script>

</body>
</html>
